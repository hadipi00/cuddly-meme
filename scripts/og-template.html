<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: 'Vazirmatn';
    src: url('/fonts/Vazirmatn-arabic.woff2') format('woff2');
    font-weight: 100 900;
    font-display: swap;
    unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF;
  }
  @font-face {
    font-family: 'Vazirmatn';
    src: url('/fonts/Vazirmatn-latin.woff2') format('woff2');
    font-weight: 100 900;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background:
      radial-gradient(900px 560px at 85% -10%, rgba(45, 212, 191, 0.16), transparent 60%),
      radial-gradient(760px 520px at -5% 30%, rgba(167, 139, 250, 0.14), transparent 55%),
      radial-gradient(600px 420px at 55% 115%, rgba(56, 189, 248, 0.1), transparent 60%),
      #070d18;
    color: #e7eef9;
    position: relative;
  }
  .grid-lines {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(148,163,184,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,0.055) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 75% 75% at 50% 40%, #000 35%, transparent 78%);
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; }
  .g1 { width: 380px; height: 380px; background: rgba(45,212,191,0.35); top: -140px; left: -100px; }
  .g2 { width: 320px; height: 320px; background: rgba(167,139,250,0.3); bottom: -120px; right: -80px; }
  .wrap { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 84px; }
  .brand-row { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
  .logo {
    width: 74px; height: 74px; border-radius: 22px;
    background: linear-gradient(135deg, #2dd4bf 0%, #38bdf8 60%, #a78bfa 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: 900; color: #052018;
    box-shadow: 0 18px 44px -12px rgba(45, 212, 191, 0.55);
  }
  .brand-name { font-size: 34px; font-weight: 900; line-height: 1.4; }
  .brand-en { font-size: 15px; letter-spacing: 7px; color: #5eead4; font-weight: 700; }
  h1 { font-size: 64px; font-weight: 900; line-height: 1.55; max-width: 900px; }
  h1 .grad {
    background: linear-gradient(90deg, #2dd4bf, #38bdf8 55%, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub { margin-top: 26px; font-size: 26px; color: #93a5bb; max-width: 880px; line-height: 1.9; }
  .pills { display: flex; gap: 14px; margin-top: 44px; }
  .pill {
    padding: 12px 26px; border-radius: 999px; font-size: 19px; font-weight: 700;
    border: 1px solid rgba(148,163,184,0.3); background: rgba(148,163,184,0.08);
    display: flex; align-items: center; gap: 9px;
  }
  .pill.on { background: rgba(45,212,191,0.14); border-color: rgba(45,212,191,0.45); color: #5eead4; }
  .pill.amber { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.4); color: #fbbf24; }
  .url {
    position: absolute; bottom: 38px; left: 84px; direction: ltr;
    font-size: 20px; color: #64748b; letter-spacing: 1px; font-weight: 600;
  }
  .spark { position: absolute; top: 64px; left: 96px; font-size: 30px; opacity: 0.8; }
</style>
</head>
<body>
  <div class="grid-lines"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="wrap">
    <div class="brand-row">
      <div class="logo">م</div>
      <div>
        <div class="brand-name">مدرس‌یار</div>
        <div class="brand-en">MODARESYAR</div>
      </div>
    </div>
    <h1>جایی که آموزش، <span class="grad">حرفه‌ای</span> می‌شود</h1>
    <p class="sub">کلاس‌های آنلاین زنده، دوره‌های ضبط‌شده با گواهی‌نامه و فروشگاه لوازم‌التحریر مدرس‌مارکت — همه در یک پلتفرم.</p>
    <div class="pills">
      <span class="pill on">✓ کلاس زنده تعاملی</span>
      <span class="pill on">✓ دوره ضبط‌شده</span>
      <span class="pill amber">★ مدرس‌مارکت</span>
    </div>
  </div>
  <div class="url">modaresyar.ir</div>
  <div class="spark">✦</div>
</body>
</html>
